<title>Chef Marina</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2340">
<link rel="stylesheet" href="style.css">
<style>:root{color-scheme:dark}html,body{background:#2b2340}</style>

<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="fx"></div>
    <button id="mapBtn" class="hud big" aria-label="map">🗺️</button>
    <button id="weatherBtn" class="hud big hidden" aria-label="weather">🍂</button>
    <button id="moodToggle" class="hud big" aria-label="moods">😊</button>
  </div>
  <div id="moodbar">
    <button class="mood" data-mood="love" aria-label="love">🥰</button>
    <button class="mood" data-mood="happy" aria-label="happy">😄</button>
    <button class="mood" data-mood="sad" aria-label="sad">😢</button>
    <button class="mood" data-mood="angry" aria-label="angry">😠</button>
    <button class="mood" data-mood="tantrum" aria-label="tantrum">😭</button>
  </div>
  <div id="panel" class="hidden"></div>
  <div id="title">
    <div class="tcard">
      <canvas id="titleCv" width="160" height="96"></canvas>
      <h1>Chef Marina</h1>
      <button id="playBtn" aria-label="play">▶️</button>
      <div id="loadbar"><i></i></div>
    </div>
  </div>
</div>
<script src="audio.js"></script>
<script src="engine.js"></script>
<script src="world.js"></script>
<script src="ui.js"></script>
<script src="game.js"></script>
<script src="features.js"></script>
<script src="fort.js"></script>
<script src="art.js"></script>
<script src="scenes.js"></script>
