<title>Match Engine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* One fixed look: a floodlit night match. Pitch fills the screen; controls float over it. */
  :root {
    --bg: #0c1411; --panel: rgba(10, 18, 15, 0.86); --ink: #eef4ef; --dim: #9db3a6;
    --line: #2a3d34; --accent: #e5484d; --gold: #f2c94c; --ok: #58c27d;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden; touch-action: none;
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }
  #app { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #game { position: absolute; inset: 0; }
  #game canvas { display: block; touch-action: none; }
  .float { position: absolute; z-index: 2; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); }

  #score {
    top: 8px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; padding: 6px 12px; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  #score .team { font-weight: 700; letter-spacing: 0.06em; display: flex; align-items: center; gap: 6px; }
  #score .chip { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink); }
  #score .num { font-size: 20px; font-weight: 800; min-width: 1ch; text-align: center; }
  #score .clock { color: var(--dim); font-size: 12px; padding-left: 10px; border-left: 1px solid var(--line); min-width: 5ch; }
  #score .phys { color: var(--gold); font-size: 11px; }

  #radar { top: 8px; left: max(8px, env(safe-area-inset-left, 0px)); padding: 4px; line-height: 0; }
  #radar canvas { display: block; width: 108px; height: 70px; }

  #controls { top: 8px; right: max(8px, env(safe-area-inset-right, 0px)); display: flex; gap: 4px; padding: 4px; }
  button {
    font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line);
    border-radius: 8px; min-width: 40px; min-height: 40px; padding: 0 10px; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
  button.primary { background: var(--accent); border-color: var(--accent); font-weight: 700; }

  #ticker {
    left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); bottom: 60px;
    display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none;
  }
  #ticker .line { padding: 6px 12px; max-width: min(640px, 100%); text-align: center; text-wrap: balance; }
  #ticker .line.old { opacity: 0.55; font-size: 12px; }
  #ticker .line.big { border-color: var(--gold); }

  #bar {
    left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); bottom: 8px;
    display: flex; justify-content: space-between; gap: 8px; pointer-events: none;
  }
  #bar button { pointer-events: auto; background: var(--panel); }
  #bar button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  .sheet {
    left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); bottom: 56px;
    max-width: 460px; max-height: calc(100% - 120px); overflow-y: auto; padding: 12px; z-index: 3;
    display: flex; flex-direction: column; gap: 8px;
  }
  .sheet.right { margin-left: auto; }
  .sheet h2 { margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
  .sheet p { margin: 0; color: var(--dim); font-size: 12px; }
  .sheet .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .sheet .grid button { text-align: left; padding: 8px 10px; min-height: 44px; }
  .sheet .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; min-height: 40px; padding: 0 8px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 3px 4px; text-align: center; }
  td:nth-child(2) { color: var(--dim); font-size: 12px; }
  @media (max-width: 520px) {
    #radar { top: 56px; }
    #controls { top: 56px; }
    #controls button { min-width: 36px; padding: 0 6px; }
  }
</style>

<div id="app">
  <div id="game"></div>

  <div id="score" class="float panel" aria-live="off">
    <span class="team"><span class="chip" id="chip0"></span><span id="name0">ENG</span></span>
    <span class="num" id="g0">0</span><span>–</span><span class="num" id="g1">0</span>
    <span class="team"><span id="name1">OPP</span><span class="chip" id="chip1"></span></span>
    <span class="clock" id="clock">0:00</span>
  </div>

  <div id="radar" class="float panel"><canvas id="radarc" width="216" height="140"></canvas></div>

  <div id="controls" class="float panel">
    <button id="sp0" aria-pressed="false" aria-label="Pause">❚❚</button>
    <button id="sp1" aria-pressed="true">1×</button>
    <button id="sp2" aria-pressed="false">2×</button>
    <button id="sp4" aria-pressed="false">4×</button>
    <button id="sp8" aria-pressed="false">8×</button>
  </div>

  <div id="ticker" class="float"></div>

  <div id="meddle" class="float panel sheet right" hidden>
    <h2>Interfere</h2>
    <p>Test buttons standing in for what the player will do in the stadium.</p>
    <div class="grid">
      <button id="m-star">Have their star arrested</button>
      <button id="m-keeper">Bribe their goalkeeper</button>
      <button id="m-wire">Spike their defenders' drinks</button>
      <button id="m-refbribe">Bribe the referee</button>
      <button id="m-distract">Distract the referee (30s)</button>
      <button id="m-floor">Knock the referee out (20s)</button>
      <button id="m-invade">Send a fan on to shoot</button>
      <button id="m-ourstar">Have our own star arrested</button>
    </div>
    <h2>Match</h2>
    <div class="row">
      <label for="opp">Opponent</label>
      <select id="opp"><option value="POR">Portugal</option><option value="ARG">Argentina</option><option value="BRA">Brazil</option></select>
      <button id="new" class="primary">New match</button>
    </div>
  </div>

  <div id="stats" class="float panel sheet" hidden>
    <h2>Match stats</h2>
    <table id="statst"></table>
    <p id="seed"></p>
  </div>

  <div id="bar" class="float">
    <div class="row" style="display:flex; gap:6px">
      <button id="b-stats" aria-pressed="false">Stats</button>
      <button id="b-cam" aria-pressed="false">Wide view</button>
    </div>
    <button id="b-meddle" aria-pressed="false">Interfere</button>
  </div>
</div>
<script src="game.js"></script>
