<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2340">
<title>Chef Marina</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chef Marina">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="fx"></div>
    <button id="mapBtn" class="hud big" aria-label="map">🗺️</button>
    <button id="weatherBtn" class="hud big hidden" aria-label="weather">🍂</button>
    <button id="moodToggle" class="hud big" aria-label="moods">😊</button>
  </div>
  <div id="moodbar">
    <button class="mood" data-mood="love" aria-label="love">🥰</button>
    <button class="mood" data-mood="happy" aria-label="happy">😄</button>
    <button class="mood" data-mood="sad" aria-label="sad">😢</button>
    <button class="mood" data-mood="angry" aria-label="angry">😠</button>
    <button class="mood" data-mood="tantrum" aria-label="tantrum">😭</button>
  </div>
  <div id="panel" class="hidden"></div>
  <div id="title">
    <div class="tcard">
      <canvas id="titleCv" width="160" height="96"></canvas>
      <h1>Chef Marina</h1>
      <button id="playBtn" aria-label="play">▶️</button>
      <div id="loadbar"><i></i></div>
    </div>
  </div>
</div>
<script src="audio.js"></script>
<script src="engine.js"></script>
<script src="world.js"></script>
<script src="ui.js"></script>
<script src="game.js"></script>
<script src="features.js"></script>
<script src="fort.js"></script>
<script src="art.js"></script>
<script src="scenes.js"></script>
<script src="pics.js"></script>
<script src="play.js"></script>
<script src="calm.js"></script>
<script src="react.js"></script>
<script src="more.js"></script>
<script src="nav.js"></script>
<script src="story.js"></script>
<script src="fun.js"></script>
<script src="floors.js"></script>
<script src="basement.js"></script>
<script src="upstairs.js"></script>
<script src="outdoor.js"></script>
<script src="bricks.js"></script>
<script src="spa.js"></script>
<script src="stuffies.js"></script>
<script src="family2.js"></script>
</body>
</html>
